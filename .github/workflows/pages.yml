# 짓기 → GitHub Pages 배포.
#   짓기: 시험 → Rust 자료 도구 · 폰용 WASM 코어를 짓는다 → 자료 도구가 CES 공식 전시사 검색에서 받아 줄인다 → 지은 것을 살핀다
#   배포: main에서만
# 공식 사이트에는 하루에 한 번만 묻는다. 그날 받은 답은 Actions 캐시에 두고 다시 쓴다.
name: 짓기와 배포

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      fresh:
        description: 오늘 받은 것이 있어도 공식 사이트에서 새로 받는다
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 짓기
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Rust 준비 (WASM 대상)
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add wasm32-unknown-unknown
          rustc --version

      - name: cargo 캐시
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: 시험
        run: cargo test --workspace --locked

      - name: 자료 도구와 폰용 코어 짓기
        run: |
          cargo build --release --locked -p ces-data
          cargo build --release --locked -p ces-core --target wasm32-unknown-unknown
          cargo build --release --locked -p ces-diary --target wasm32-unknown-unknown

      - name: 장소 자료 살피기
        run: target/release/ces-data check-places

      - name: 폰의 일기 정리(diary.wasm)가 자료 도구와 같은 한 장을 만드는지 견주기
        run: node scripts/diary-wasm.mjs target/wasm32-unknown-unknown/release/ces_diary.wasm target/release/ces-data

      - name: 날짜
        id: day
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: 받아 둔 답 꺼내기
        id: raw
        uses: actions/cache/restore@v6
        with:
          path: .cache/ces-raw
          key: ces-raw-${{ steps.day.outputs.day }}-none
          restore-keys: |
            ces-raw-${{ steps.day.outputs.day }}-
            ces-raw-

      - name: 자료 받기 · 줄이기 · 찾기 색인 (Rust 자료 도구)
        id: data
        env:
          MATCHED: ${{ steps.raw.outputs.cache-matched-key }}
          DAY: ${{ steps.day.outputs.day }}
          FRESH: ${{ inputs.fresh }}
        run: |
          tool=target/release/ces-data
          today=false
          case "$MATCHED" in "ces-raw-$DAY-"*) today=true ;; esac
          fresh=false
          if [ "$today" = false ] || [ "$FRESH" = true ]; then
            if "$tool" build --out dist/data --save-raw .cache/ces-raw.new; then
              rm -rf .cache/ces-raw
              mv .cache/ces-raw.new .cache/ces-raw
              fresh=true
            else
              echo "::warning::공식 사이트에서 받지 못했다. 받아 둔 답이 있으면 그것으로 짓는다."
              rm -rf .cache/ces-raw.new dist/data
            fi
          fi
          if [ "$fresh" = false ] && [ -f .cache/ces-raw/fetched-at.txt ]; then
            echo "받아 둔 답으로 짓는다 (받은 때 $(cat .cache/ces-raw/fetched-at.txt))"
            "$tool" build --out dist/data --from .cache/ces-raw
          fi
          if [ ! -f dist/data/meta.json ]; then
            echo "::warning::전시사 자료 없이 짓는다. 첫 화면은 열리고, 자료 칸에는 받지 못했다고 보인다."
          fi
          echo "fresh=$fresh" >> "$GITHUB_OUTPUT"

      - name: 받은 답 넣어 두기
        if: steps.data.outputs.fresh == 'true'
        uses: actions/cache/save@v6
        with:
          path: .cache/ces-raw
          key: ces-raw-${{ steps.day.outputs.day }}-${{ github.run_id }}-${{ github.run_attempt }}

      # 세션 일정(공식 ces.tech/schedule). 전시사와 같은 규칙: 하루에 한 번만 묻고, 그날 받은 쪽은 캐시에 두고 다시 쓴다.
      # 못 받으면 경고만 하고 짓는다(세션 일정 화면은 "받지 못했다"를 보인다).
      - name: 받아 둔 일정 꺼내기
        id: sched-raw
        uses: actions/cache/restore@v6
        with:
          path: .cache/ces-sched
          key: ces-sched-${{ steps.day.outputs.day }}-none
          restore-keys: |
            ces-sched-${{ steps.day.outputs.day }}-
            ces-sched-

      - name: 세션 일정 받기 (Rust 자료 도구)
        id: sched
        env:
          MATCHED: ${{ steps.sched-raw.outputs.cache-matched-key }}
          DAY: ${{ steps.day.outputs.day }}
          FRESH: ${{ inputs.fresh }}
        run: |
          tool=target/release/ces-data
          today=false
          case "$MATCHED" in "ces-sched-$DAY-"*) today=true ;; esac
          fresh=false
          if [ "$today" = false ] || [ "$FRESH" = true ]; then
            if "$tool" sessions --out dist/data --save-raw .cache/ces-sched.new; then
              rm -rf .cache/ces-sched
              mv .cache/ces-sched.new .cache/ces-sched
              fresh=true
            else
              echo "::warning::공식 일정을 받지 못했다. 받아 둔 것이 있으면 그것으로 짓는다."
              rm -rf .cache/ces-sched.new dist/data/sessions.json
            fi
          fi
          if [ "$fresh" = false ] && [ -f .cache/ces-sched/fetched-at.txt ]; then
            echo "받아 둔 일정으로 짓는다 (받은 때 $(cat .cache/ces-sched/fetched-at.txt))"
            "$tool" sessions --out dist/data --from .cache/ces-sched || echo "::warning::받아 둔 일정을 읽지 못했다."
          fi
          if [ ! -f dist/data/sessions.json ]; then
            echo "::warning::세션 일정 없이 짓는다. 세션 일정 화면에는 받지 못했다고 보인다."
          fi
          echo "fresh=$fresh" >> "$GITHUB_OUTPUT"

      - name: 받은 일정 넣어 두기
        if: steps.sched.outputs.fresh == 'true'
        uses: actions/cache/save@v6
        with:
          path: .cache/ces-sched
          key: ces-sched-${{ steps.day.outputs.day }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: 화면과 코어를 모은다
        run: |
          mkdir -p dist/data
          cp -R web/. dist/
          cp data/info.json data/categories.json data/places.json data/osm-map.json data/booth-spots.json data/indoor-paths-guess.json data/transit.json data/home.json config/settings.json dist/data/
          cp target/wasm32-unknown-unknown/release/ces_core.wasm dist/core.wasm
          cp target/wasm32-unknown-unknown/release/ces_diary.wasm dist/diary.wasm
          # 보드(/board/)와 테스터 안내(/testers/). 앱이 미리 받지 않는 곳이다.
          mkdir -p dist/board
          cp docs/board/index.html docs/board/board-data.js docs/board/board.single.html dist/board/
          node scripts/guide-page.mjs docs/테스터_안내.md dist/testers/index.html
          ls -la dist dist/data 2>/dev/null || true

      - name: 폰 안 받아쓰기 실행기 캐시
        uses: actions/cache@v6
        with:
          path: .cache/speech-runtime
          key: speech-runtime-${{ hashFiles('data/speech-model.json') }}

      - name: 폰 안 받아쓰기 실행기를 받아 놓는다 (sha256 확인)
        run: |
          cp data/speech-model.json dist/data/
          node scripts/fetch-speech-runtime.mjs dist .cache/speech-runtime

      - name: 전시사 자료를 홀마다 나눈다 (지도가 홀로 가까이 갈 때 그 홀의 것만 받게)
        run: node scripts/split-halls.mjs dist

      - name: 판 이름 찍기 · 인터넷 없이 담아 둘 목록
        run: node scripts/stamp.mjs dist

      - name: 지은 것 살피기
        run: node scripts/smoke.mjs dist

      # 인터넷이 없는 전시장에서도 열리는지: 한 번 연 뒤 네트워크를 끊고 화면마다 열어 쓴다(tests/offline.mjs, Chromium).
      # 전시사 · 세션 자료를 못 받은 날은 자료 쪽 시험이 뜻이 없어 건너뛴다(경고만). 브라우저 시험이라 한 번은 다시 해 본다.
      - name: 인터넷을 끊고 써 보기 (Chromium)
        run: |
          if [ ! -f dist/data/meta.json ] || [ ! -f dist/data/sessions.json ]; then
            echo "::warning::전시사나 세션 자료가 없어 오프라인 시험을 건너뛴다."
            exit 0
          fi
          npm install --no-save --no-audit --no-fund --prefix .cache/pw playwright-core@1.65.1
          export PLAYWRIGHT_CORE="$PWD/.cache/pw/node_modules/playwright-core"
          node "$PLAYWRIGHT_CORE/cli.js" install --with-deps chromium
          node tests/offline.mjs dist --out=offline.md || { echo "::warning::오프라인 시험이 한 번 실패했다. 다시 해 본다."; node tests/offline.mjs dist --out=offline.md; }
          cat offline.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Pages 배포
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
