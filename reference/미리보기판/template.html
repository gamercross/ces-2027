<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>CES 2027 부스 3D 지도</title>
<style>
:root{--ink:#1d2433;--muted:#667085;--line:#e4e7ec;--soft:#f5f7fa;--accent:#3b5bdb;--warn:#c92a2a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;color:var(--ink);background:#e9edf3;overflow:hidden;-webkit-text-size-adjust:100%}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:8px 14px;background:#121a2c;color:#fff;flex-wrap:wrap}
header .ttl b{font-size:16px;letter-spacing:-.2px}
header .ttl span{display:block;font-size:11.5px;color:#aab4c8;margin-top:1px}
header .hbtns{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
header button{background:#25304a;border:1px solid #34405e;color:#e8ecf5;border-radius:8px;padding:5px 10px;font-size:13px}
header button.on{background:#3b5bdb;border-color:#3b5bdb}
#notice{background:#fff4e6;color:#7a3e00;font-size:12px;padding:5px 14px;border-bottom:1px solid #ffd8a8}
#notice b{font-weight:700}
#main{flex:1;display:flex;min-height:0}
#side{width:390px;max-width:44vw;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tab{flex:1;background:none;border:0;padding:10px 0;font-weight:600;color:var(--muted);border-bottom:2px solid transparent}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab span{display:inline-block;min-width:20px;padding:0 6px;border-radius:10px;background:#e7ebff;color:var(--accent);font-size:12px;margin-left:4px}
section.pane{flex:1;min-height:0;display:flex;flex-direction:column}
section.pane[hidden]{display:none}
.ctl{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
#q{width:100%;padding:9px 11px;border:1px solid #cfd5df;border-radius:9px;font-size:14px}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.row select{flex:1;min-width:0;padding:6px 8px;border:1px solid #cfd5df;border-radius:8px;background:#fff;font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid #cfd5df;background:#fff;border-radius:16px;padding:4px 10px;font-size:12.5px}
.chip.on{background:var(--c,#3b5bdb);border-color:var(--c,#3b5bdb);color:#fff}
.chip small{opacity:.75}
.lbl{font-size:12px;color:var(--muted)}
#count{font-size:12px;color:var(--muted);padding:6px 12px}
#results{flex:1;overflow:auto;padding:0 6px 10px}
.res{display:flex;gap:8px;align-items:flex-start;padding:8px 8px;border-radius:8px;cursor:pointer}
.res:hover{background:var(--soft)}
.res .dot{width:10px;height:10px;border-radius:3px;margin-top:5px;flex:none}
.res .nm{font-size:13.5px;font-weight:600;line-height:1.3}
.res .meta{font-size:12px;color:var(--muted);margin-top:2px}
.badge{display:inline-block;font-size:10.5px;padding:1px 6px;border-radius:9px;margin-left:4px;vertical-align:1px;font-weight:600}
.b-kr{background:#ffe3e3;color:#c92a2a}.b-aw{background:#fff3bf;color:#8a6100}.b-boi{background:#ffd43b;color:#5c4400}
.more{display:block;margin:8px auto;padding:6px 14px;border:1px solid #cfd5df;border-radius:8px;background:#fff;font-size:13px}
.quick{padding:4px 12px 8px}
.quick .chip{margin:0 4px 6px 0}
#view{flex:1;position:relative;min-width:0;background:#e9edf3}
#view canvas{display:block;width:100%;height:100%;touch-action:none}
#tip{position:absolute;pointer-events:none;background:rgba(18,26,44,.92);color:#fff;font-size:12px;padding:5px 8px;border-radius:6px;white-space:nowrap;transform:translate(12px,12px);display:none;z-index:5;max-width:320px;overflow:hidden;text-overflow:ellipsis}
#card{position:absolute;top:12px;right:12px;width:340px;max-height:calc(100% - 24px);overflow:auto;background:#fff;border-radius:12px;box-shadow:0 8px 28px rgba(16,24,40,.18);padding:14px 14px 12px;z-index:6;font-size:13px}
#card[hidden]{display:none}
#card h3{margin:0 26px 4px 0;font-size:16px;line-height:1.3}
#card .x{position:absolute;top:8px;right:8px;border:0;background:#f1f3f5;border-radius:50%;width:26px;height:26px;font-size:14px;line-height:26px;padding:0}
#card .sec{margin-top:9px}
#card .sec b{display:block;font-size:11.5px;color:var(--muted);font-weight:600;margin-bottom:3px}
#card .desc{color:#344054;line-height:1.45;font-size:12.5px}
#card .acts{display:flex;gap:6px;margin-top:11px;flex-wrap:wrap}
#card .acts button,#card .acts a{flex:1;text-align:center;border:1px solid #cfd5df;background:#fff;border-radius:8px;padding:7px 6px;font-size:12.5px;text-decoration:none;color:var(--ink);white-space:nowrap}
#card .acts .pri{background:var(--accent);border-color:var(--accent);color:#fff}
#card .bl{cursor:pointer;color:var(--accent);text-decoration:underline;text-underline-offset:2px}
#card .ml{max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:8px}
#card .ml div{padding:6px 8px;border-bottom:1px solid var(--line);cursor:pointer}
#card .ml div:last-child{border-bottom:0}
#card .ml div:hover{background:var(--soft)}
#legend{position:absolute;left:12px;bottom:34px;background:rgba(255,255,255,.94);border-radius:10px;padding:8px 10px;font-size:11.5px;box-shadow:0 2px 10px rgba(16,24,40,.12);z-index:4;max-width:300px}
#legend .it{display:inline-flex;align-items:center;gap:4px;margin:2px 8px 2px 0;white-space:nowrap}
#legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
#hint{position:absolute;left:12px;bottom:8px;font-size:11px;color:#55607a;z-index:4}
#modal{position:fixed;inset:0;background:rgba(16,24,40,.45);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
#modal[hidden]{display:none}
#modal .box{background:#fff;border-radius:14px;max-width:720px;width:100%;max-height:88vh;overflow:auto;padding:18px 20px;font-size:13.5px;line-height:1.55}
#modal h2{margin:0 0 8px;font-size:18px}
#modal h4{margin:14px 0 4px;font-size:14px}
#modal table{border-collapse:collapse;width:100%;font-size:12.5px}
#modal td,#modal th{border:1px solid var(--line);padding:5px 7px;text-align:left;vertical-align:top}
#modal th{background:var(--soft)}
#modal .close{float:right;border:1px solid #cfd5df;background:#fff;border-radius:8px;padding:4px 10px}
#planTop{padding:10px 12px;border-bottom:1px solid var(--line);font-size:12.5px;color:#344054;display:flex;flex-direction:column;gap:8px}
#planTop .row button{border:1px solid #cfd5df;background:#fff;border-radius:8px;padding:6px 8px;font-size:12.5px}
#planTop .row button.pri{background:var(--accent);border-color:var(--accent);color:#fff}
#planList{flex:1;overflow:auto;padding:4px 8px 12px}
.day{margin-top:10px}
.day h5{margin:6px 4px;font-size:13px;display:flex;align-items:center;gap:6px}
.day h5 i{width:10px;height:10px;border-radius:50%;display:inline-block}
.pi{border:1px solid var(--line);border-radius:9px;padding:7px 8px;margin:6px 0;background:#fff}
.pi .top{display:flex;gap:6px;align-items:center}
.pi .no{flex:none;width:20px;height:20px;border-radius:50%;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.pi .nm{font-weight:600;font-size:13px;flex:1;min-width:0;cursor:pointer}
.pi .nm small{display:block;font-weight:400;color:var(--muted);font-size:11.5px}
.pi select{border:1px solid #cfd5df;border-radius:6px;font-size:12px;padding:2px 4px;background:#fff}
.pi .rm{border:0;background:none;color:#98a2b3;font-size:16px;padding:0 2px}
.pi .bot{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap;align-items:center}
.pi .bot .chip{padding:2px 8px;font-size:11.5px}
.pi .bot input{flex:1;min-width:120px;border:1px solid #e1e5ec;border-radius:6px;padding:4px 7px;font-size:12px}
.empty{color:var(--muted);font-size:13px;padding:18px 10px;line-height:1.6}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#121a2c;color:#fff;padding:8px 14px;border-radius:8px;font-size:13px;z-index:30;display:none}
@media (max-width:820px){
  header{padding:6px 10px;gap:6px}
  header .ttl span{display:none}
  header button{padding:4px 8px;font-size:12px}
  #notice{font-size:11px;padding:4px 10px}
  #main{flex-direction:column-reverse}
  #side{width:100%;max-width:none;height:48%;border-right:0;border-top:1px solid var(--line)}
  #card{left:8px;right:8px;width:auto;top:8px;max-height:60%}
  #legend{display:none}
  #hint{font-size:10px}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="ttl"><b>CES 2027 부스 3D 지도</b><span id="sub"></span></div>
    <div class="hbtns">
      <button data-cam="all" class="on">전체</button>
      <button data-cam="lvcc">LVCC</button>
      <button data-cam="ven">베네시안</button>
      <button data-cam="cs">C Space</button>
      <button id="btnInfo">알아둘 것</button>
    </div>
  </header>
  <div id="notice"><b>미리 보기 판</b> · 홀 위치는 CES 공식 캠퍼스 지도(2026-09-29), 홀 안 자리는 부스 번호로 짐작했어요. 정식 배치도가 열리면 바꿉니다. 가기 전에 공식 지도로 한 번 더 확인하세요.</div>
  <div id="main">
    <aside id="side">
      <div class="tabs">
        <button class="tab on" data-tab="find">찾기</button>
        <button class="tab" data-tab="plan">내 목록<span id="planCount">0</span></button>
      </div>
      <section class="pane" id="pane-find">
        <div class="ctl">
          <input id="q" type="search" placeholder="회사 · 부스 번호 · 키워드 (예: 삼성, 21108, robot)" autocomplete="off">
          <div class="row"><select id="fPlace"></select><select id="fCat"></select></div>
          <div class="chips" id="fAud"><span class="lbl">누구에게</span></div>
          <div class="chips">
            <button class="chip" id="fKor" style="--c:#c92a2a">한국 기업</button>
            <button class="chip" id="fAward" style="--c:#e8a200">혁신상</button>
            <span class="lbl" style="margin-left:auto">색</span>
            <select id="colorMode" style="padding:4px 6px;border:1px solid #cfd5df;border-radius:8px;font-size:12.5px;background:#fff">
              <option value="group">분야</option><option value="place">장소</option><option value="kor">한국 기업</option><option value="award">혁신상</option>
            </select>
            <button class="chip" id="reset">초기화</button>
          </div>
        </div>
        <div id="count"></div>
        <div id="results"></div>
      </section>
      <section class="pane" id="pane-plan" hidden>
        <div id="planTop">
          <div>볼 곳을 고르고 날짜를 정한 뒤, <b>링크</b>나 <b>목록 코드</b>를 단톡방에 나누면 같이 준비할 수 있어요. 현장에서는 메모와 네 태그를 적어 두고, 다녀와서 마크다운으로 내보내세요.</div>
          <div class="row">
            <button id="pSort" class="pri">동선 순서로</button>
            <button id="pAuto">캠퍼스별 날짜 채우기</button>
            <button id="pRoute">지도에 동선</button>
          </div>
          <div class="row">
            <button id="pLink">링크 복사</button>
            <button id="pText">단톡방 글 복사</button>
            <button id="pCode">목록 코드 복사</button>
            <button id="pImport">코드 넣기</button>
          </div>
          <div class="row">
            <button id="pMd">마크다운 받기</button>
            <button id="pCsv">CSV 받기</button>
            <button id="pClear" style="color:#c92a2a">비우기</button>
          </div>
        </div>
        <div id="planList"></div>
      </section>
    </aside>
    <div id="view">
      <div id="tip"></div>
      <div id="card" hidden></div>
      <div id="legend"></div>
      <div id="hint">끌기: 옮기기 · 오른쪽 끌기 또는 두 손가락: 돌리기 · 휠 또는 벌리기: 확대 · 부스 누르기: 자세히</div>
    </div>
  </div>
</div>
<div id="modal" hidden><div class="box" id="modalBox"></div></div>
<div id="toast"></div>

  $('#pImport').onclick = () => { const s = window.prompt('받은 목록 코드나 링크를 붙여 넣으세요'); if (!s) return; const items = readCode(s); if (!items.length) { toast('읽을 수 있는 곳이 없어요'); return; } const n = mergeItems(items); toast(`${n}곳을 더했어요 (이미 있던 곳은 그대로)`); };
  $('#pMd').onclick = () => (plan.length ? download('CES2027_내동선.md', planMd(), 'text/markdown;charset=utf-8') : toast('목록이 비어 있어요'));
  $('#pCsv').onclick = () => (plan.length ? download('CES2027_내동선.csv', planCsv(), 'text/csv;charset=utf-8') : toast('목록이 비어 있어요'));
  $('#pClear').onclick = () => { if (plan.length && window.confirm('내 목록을 모두 비울까요?')) { plan = []; savePlan(); afterPlan(); } };
}
/* 누르기 · 올려 두기 */
const ray = new THREE.Raycaster(); const ndc = new THREE.Vector2(); let down = null; let hoverQ = null;
function pickAt(cx, cy) {
  const r = renderer.domElement.getBoundingClientRect(); ndc.set(((cx - r.left) / r.width) * 2 - 1, -((cy - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObject(inst, false);
  for (const h of hits) { if (h.instanceId != null && boothMatch[h.instanceId]) return h.instanceId; }
  return hits.length ? hits[0].instanceId : null;
}
renderer.domElement.addEventListener('pointerdown', (ev) => { down = { x: ev.clientX, y: ev.clientY }; });
renderer.domElement.addEventListener('pointerup', (ev) => {
  if (!down) return; const moved = Math.hypot(ev.clientX - down.x, ev.clientY - down.y); down = null;
  if (moved > 6) return; const id = pickAt(ev.clientX, ev.clientY); if (id != null) selectBooth(id, false);
});
renderer.domElement.addEventListener('pointermove', (ev) => {
  if (ev.pointerType !== 'mouse') return; hoverQ = { x: ev.clientX, y: ev.clientY };
});
renderer.domElement.addEventListener('pointerleave', () => { $('#tip').style.display = 'none'; hoverQ = null; });
function doHover() {
  if (!hoverQ || down) return; const q = hoverQ; hoverQ = null;
  const id = pickAt(q.x, q.y); const tip = $('#tip');
  if (id == null) { tip.style.display = 'none'; renderer.domElement.style.cursor = ''; return; }
  const b = BOOTHS[id]; const r = view.getBoundingClientRect();
  const names = (matchEx ? b.ex.filter((x) => matchEx.has(x)) : b.ex); const first = EX[(names[0] != null ? names[0] : b.ex[0])].name;
  tip.textContent = `${b.code} · ${first}${b.ex.length > 1 ? ` 외 ${b.ex.length - 1}곳` : ''}`;
  tip.style.left = (q.x - r.left) + 'px'; tip.style.top = (q.y - r.top) + 'px'; tip.style.display = 'block'; renderer.domElement.style.cursor = 'pointer';
}
function resize() { const w = view.clientWidth, h = view.clientHeight; renderer.setSize(w, h, false); camera.aspect = w / Math.max(1, h); camera.updateProjectionMatrix(); sizeLabels(); if (typeof renderRoute === 'function' && plan) renderRoute(); }
window.addEventListener('resize', resize);

/* ---------- 14. 돌리기 ---------- */
function tick(now) {
  if (fly) {
    const k = Math.min(1, (now - fly.t0) / fly.dur); const e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    controls.target.lerpVectors(fly.fromT, fly.toT, e); camera.position.lerpVectors(fly.fromP, fly.toP, e); if (k >= 1) fly = null;
  }
  controls.update();
  const d = camera.position.distanceTo(controls.target);
  labels.forEach((l) => { const u = l.userData; l.visible = d >= u.minD && d <= u.maxD && !u.dim; });
  if (pin.visible) { const s = 1 + 0.12 * Math.sin(now / 220); pin.scale.set(s, s, s); }
  doHover();
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}

/* ---------- 15. 시작 ---------- */
$('#sub').textContent = `전시사 ${EX.length.toLocaleString()}곳 · CES 공식 전시사 목록 ${DATA.v} 기준 · 라스베이거스 1/6~1/9`;
setupControls(); resize();
const c0 = camFor('all'); camera.position.copy(c0.p); controls.target.copy(c0.t); controls.update();
computeMatch(); paintBooths(); renderLegend(); renderResults(); renderPlan(); renderRoute(); $('#planCount').textContent = plan.length;
if (location.hash.indexOf('plan=') >= 0) {
  const items = readCode(location.hash);
  if (items.length) {
    setTimeout(() => {
      const ok = !plan.length || window.confirm(`받은 목록 ${items.length}곳을 내 목록에 더할까요?`);
      if (ok) { const n = mergeItems(items); toast(`받은 목록에서 ${n}곳을 더했어요`); document.querySelector('[data-tab="plan"]').click(); }
    }, 300);
  }
}
window.__ces = { EX, BOOTHS, PLACES, plan: () => plan, selectEx, flyCam, st, refresh };
requestAnimationFrame(tick);
})();
